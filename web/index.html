<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CASHBACKFLY</title>
    <meta
      name="description"
      content="Муху-дрозофилу научили выбирать категории кешбэка в Яндекс Пэй. Вот такие вот дела, собачка."
    />
    <!-- Текст и картинка превью при шаринге ссылки (Телеграм/VK и т.п.).
         URL картинки абсолютный — многие парсеры превью не резолвят
         относительные og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cashbackfly.bz" />
    <meta property="og:title" content="CASHBACKFLY" />
    <meta
      property="og:description"
      content="Муху-дрозофилу научили выбирать категории кешбэка в Яндекс Пэй. Вот такие вот дела, собачка."
    />
    <meta property="og:image" content="https://cashbackfly.bz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CASHBACKFLY" />
    <meta
      name="twitter:description"
      content="Муху-дрозофилу научили выбирать категории кешбэка в Яндекс Пэй. Вот такие вот дела, собачка."
    />
    <meta name="twitter:image" content="https://cashbackfly.bz/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/fly-pixel.svg" />
    <!-- Отдельная растровая иконка (муха + название) — под системы, которые
         не берут SVG-фавикон для своих целей: превью в шторке «Поделиться»
         на телефоне, значок на домашнем экране, вкладка в старых браузерах. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/cashbackfly-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/cashbackfly-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
