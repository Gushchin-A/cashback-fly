<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CASHBACKFLY — скоро снова полетим</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("/fonts/free/PressStart2P-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0c13;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        min-height: 100vh;
        padding: 24px;
      }
      svg {
        width: 180px;
        height: auto;
        image-rendering: pixelated;
        shape-rendering: crispEdges;
      }
      p {
        margin: 0;
        color: #ffffff;
        font-family: "Press Start 2P", monospace;
        font-size: 18px;
        text-align: center;
        line-height: 1.6;
        max-width: 22ch;
      }
      @media (max-width: 480px) {
        svg { width: 120px; }
        p { font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 16 12" shape-rendering="crispEdges">
      <rect x="3" y="1" width="4" height="1" fill="#b88cff" />
      <rect x="3" y="2" width="5" height="1" fill="#b88cff" />
      <rect x="2" y="3" width="4" height="1" fill="#b88cff" />
      <rect x="3" y="4" width="4" height="1" fill="#b88cff" />
      <rect x="3" y="5" width="9" height="1" fill="#3a3c48" />
      <rect x="2" y="6" width="11" height="1" fill="#3a3c48" />
      <rect x="2" y="7" width="11" height="1" fill="#3a3c48" />
      <rect x="3" y="8" width="9" height="1" fill="#3a3c48" />
      <rect x="10" y="6" width="2" height="2" fill="#ff5577" />
      <rect x="4" y="9" width="1" height="1" fill="#3a3c48" />
      <rect x="5" y="10" width="1" height="1" fill="#3a3c48" />
      <rect x="6" y="11" width="1" height="1" fill="#3a3c48" />
      <rect x="6" y="9" width="1" height="1" fill="#3a3c48" />
      <rect x="7" y="10" width="1" height="1" fill="#3a3c48" />
      <rect x="8" y="11" width="1" height="1" fill="#3a3c48" />
      <rect x="8" y="9" width="1" height="1" fill="#3a3c48" />
      <rect x="9" y="10" width="1" height="1" fill="#3a3c48" />
      <rect x="10" y="11" width="1" height="1" fill="#3a3c48" />
    </svg>
    <p>Скоро снова полетим!</p>
  </body>
</html>
